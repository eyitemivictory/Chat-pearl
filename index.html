<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Pearl</title>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f8f7fc;
      color: #171522;
    }

    .app {
      max-width: 500px;
      min-height: 100vh;
      margin: auto;
      padding: 35px 22px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777481;
      font-size: 16px;
      margin-bottom: 35px;
    }

    .pearl {
      width: 110px;
      height: 110px;
      border-radius: 55px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 35px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
      font-size: 48px;
    }

    .question {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .card {
      background: white;
      border: none;
      width: 100%;
      padding: 20px;
      margin-bottom: 14px;
      border-radius: 18px;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(0,0,0,0.05);
    }

    .card:active {
      transform: scale(0.98);
    }

    .icon {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .card-title {
      font-size: 18px;
      font-weight: bold;
    }

    .card-text {
      color: #777481;
      margin-top: 5px;
    }

    #chat {
      display: none;
    }

    .back {
      background: none;
      border: none;
      font-size: 17px;
      cursor: pointer;
      margin-bottom: 25px;
    }

    .chat-box {
      min-height: 60vh;
      background: white;
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 15px;
      overflow-y: auto;
    }

    .message {
      padding: 12px 15px;
      border-radius: 16px;
      margin-bottom: 12px;
      max-width: 85%;
      line-height: 1.4;
    }

    .pearl-message {
      background: #f0eef7;
    }

    .user-message {
      background: #171522;
      color: white;
      margin-left: auto;
    }

    .input-area {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 15px;
      font-size: 16px;
      outline: none;
    }

    .send {
      border: none;
      background: #171522;
      color: white;
      padding: 0 18px;
      border-radius: 15px;
      font-size: 16px;
      cursor: pointer;
    }
  </style></head><body>  <div class="app"><!-- HOME -->
<div id="home">

  <h1>Hi, I'm Pearl 💎</h1>

  <p class="subtitle">
    What are we figuring out today?
  </p>

  <div class="pearl">✦</div>

  <p class="question">What can I help with?</p>

  <button class="card" onclick="openChat()">
    <div class="icon">💬</div>
    <div class="card-title">Chat with Pearl</div>
    <div class="card-text">Ask me anything</div>
  </button>

  <button class="card">
    <div class="icon">📷</div>
    <div class="card-title">Show Pearl</div>
    <div class="card-text">Show me something</div>
  </button>

  <button class="card">
    <div class="icon">🎙️</div>
    <div class="card-title">Talk to Pearl</div>
    <div class="card-text">Have a conversation</div>
  </button>

</div>

<!-- CHAT -->
<div id="chat">

  <button class="back" onclick="goHome()">← Back</button>

  <h1>Chat with Pearl 💎</h1>

  <p class="subtitle">Ask me anything.</p>

  <div class="chat-box" id="messages">

    <div class="message pearl-message">
      Hi! I'm Pearl 💎 What would you like to figure out today?
    </div>

  </div>

  <div class="input-area">

    <input
      id="userInput"
      type="text"
      placeholder="Type your question..."
      onkeydown="if(event.key === 'Enter') sendMessage()"
    >

    <button class="send" onclick="sendMessage()">
      Send
    </button>

  </div>

</div>

  </div>  <script>

    function openChat() {
      document.getElementById("home").style.display = "none";
      document.getElementById("chat").style.display = "block";
    }

    function goHome() {
      document.getElementById("chat").style.display = "none";
      document.getElementById("home").style.display = "block";
    }

    function sendMessage() {

      const input = document.getElementById("userInput");
      const text = input.value.trim();

      if (text === "") return;

      const messages = document.getElementById("messages");

      const userMessage = document.createElement("div");
      userMessage.className = "message user-message";
      userMessage.textContent = text;

      messages.appendChild(userMessage);

      input.value = "";

      setTimeout(function() {

        const pearlMessage = document.createElement("div");
        pearlMessage.className = "message pearl-message";

        pearlMessage.textContent =
          "I'm Pearl 💎 I'm still learning, but soon I'll be able to give you a real AI-powered answer to that.";

        messages.appendChild(pearlMessage);

        messages.scrollTop = messages.scrollHeight;

      }, 600);
    }

  </script></body>
</html>
