    <!DOCTYPE html><html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Pearl</title>  <style>
    body {
      margin: 0;
      background: #f8f7fc;
      font-family: Arial, sans-serif;
      color: #171522;
    }

    .app {
      max-width: 500px;
      margin: auto;
      padding: 35px 20px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777481;
      margin-bottom: 30px;
    }

    .pearl {
      width: 110px;
      height: 110px;
      margin: 30px auto;
      background: white;
      border-radius: 55px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 50px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.12);
    }

    .question {
      font-size: 20px;
      font-weight: bold;
    }

    .card {
      width: 100%;
      border: 0;
      background: white;
      padding: 20px;
      margin: 10px 0;
      border-radius: 18px;
      text-align: left;
      font-size: 16px;
      cursor: pointer;
    }

    .icon {
      font-size: 28px;
    }

    .card-title {
      font-size: 18px;
      font-weight: bold;
      margin-top: 8px;
    }

    .card-text {
      color: #777481;
      margin-top: 5px;
    }

    #chat {
      display: none;
    }

    .back {
      border: 0;
      background: transparent;
      font-size: 17px;
      padding: 10px 0;
      cursor: pointer;
    }

    .messages {
      background: white;
      min-height: 55vh;
      padding: 15px;
      border-radius: 18px;
      margin: 20px 0;
      overflow-y: auto;
    }

    .message {
      padding: 12px;
      margin: 10px 0;
      border-radius: 15px;
      max-width: 80%;
    }

    .pearl-message {
      background: #eeeaf7;
    }

    .user-message {
      background: #171522;
      color: white;
      margin-left: auto;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 14px;
      font-size: 16px;
    }

    .send {
      border: 0;
      background: #171522;
      color: white;
      padding: 0 18px;
      border-radius: 14px;
      font-size: 16px;
    }
  </style></head><body><div class="app">  <div id="home"><h1>Hi, I'm Pearl 💎</h1>

<div class="subtitle">
  What are we figuring out today?
</div>

<div class="pearl">✦</div>

<div class="question">
  What can I help with?
</div>

<button class="card" onclick="openChat()">
  <div class="icon">💬</div>
  <div class="card-title">Chat with Pearl</div>
  <div class="card-text">Ask me anything</div>
</button>

<button class="card" onclick="showMessage('Show Pearl is coming soon! 📷')">
  <div class="icon">📷</div>
  <div class="card-title">Show Pearl</div>
  <div class="card-text">Show me something</div>
</button>

<button class="card" onclick="showMessage('Talk to Pearl is coming soon! 🎙️')">
  <div class="icon">🎙️</div>
  <div class="card-title">Talk to Pearl</div>
  <div class="card-text">Have a conversation</div>
</button>

  </div>  <div id="chat"><button class="back" onclick="goHome()">← Back</button>

<h1>Chat with Pearl 💎</h1>

<div class="subtitle">
  Ask me anything.
</div>

<div class="messages" id="messages">

  <div class="message pearl-message">
    Hi! I'm Pearl 💎 What would you like to figure out today?
  </div>

</div>

<div class="input-row">

  <input
    id="userInput"
    type="text"
    placeholder="Type your question..."
  >

  <button class="send" onclick="sendMessage()">
    Send
  </button>

</div>

  </div></div><script>

function openChat() {
  document.getElementById("home").style.display = "none";
  document.getElementById("chat").style.display = "block";
}

function goHome() {
  document.getElementById("chat").style.display = "none";
  document.getElementById("home").style.display = "block";
}

function showMessage(message) {
  alert(message);
}

function sendMessage() {

  var input = document.getElementById("userInput");
  var text = input.value.trim();

  if (text === "") {
    return;
  }

  var messages = document.getElementById("messages");

  var userMessage = document.createElement("div");
  userMessage.className = "message user-message";
  userMessage.innerText = text;

  messages.appendChild(userMessage);

  input.value = "";

  setTimeout(function() {

    var pearlMessage = document.createElement("div");
    pearlMessage.className = "message pearl-message";

    pearlMessage.innerText =
      "That's a great question! 💎 I'm Pearl, and we're going to figure it out together.";

    messages.appendChild(pearlMessage);

    messages.scrollTop = messages.scrollHeight;

  }, 500);
}

</script></body>
</html>
